<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Caderneta TEA Digital · Gov.PI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
:root {
  --gov-blue: #1351B4;
  --gov-blue-dark: #0C447C;
  --gov-blue-light: #E6F1FB;
  --gov-blue-mid: #B5D4F4;
  --gov-green: #168821;
  --gov-yellow: #FFCD07;
  --teal-50: #E1F5EE;
  --teal-600: #0F6E56;
  --teal-700: #085041;
  --purple-50: #EEEDFE;
  --purple-600: #534AB7;
  --purple-700: #3C3489;
  --amber-50: #FAEEDA;
  --amber-600: #BA7517;
  --amber-700: #854F0B;
  --coral-50: #FAECE7;
  --coral-600: #993C1D;
  --red-50: #FCEBEB;
  --red-600: #A32D2D;
  --red-700: #791F1F;
  --gray-50: #FAFAF7;
  --gray-100: #F1EFE8;
  --gray-200: #E5E3DA;
  --gray-300: #D3D1C7;
  --gray-500: #888780;
  --gray-700: #5F5E5A;
  --gray-900: #2C2C2A;
  --bg: #F5F4EE;
  --surface: #ffffff;
  --border: rgba(0,0,0,0.08);
  --border-strong: rgba(0,0,0,0.16);
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.06);
  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.08);
  --font-display: 'Rubik', system-ui, sans-serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--gray-900);
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
  font-size: 14px;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select, textarea { font-family: inherit; }
ul, ol { list-style: none; }

/* ========== LAYOUT GLOBAL ========== */
.shell {
  display: grid;
  grid-template-columns: 1fr;
  min-height: 100vh;
}
@media (min-width: 1024px) {
  .shell { grid-template-columns: 320px 1fr; }
}

/* ========== SIDEBAR (DEMO CONTROL) ========== */
.demo-sidebar {
  background: white;
  border-right: 0.5px solid var(--border);
  padding: 28px 24px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  display: none;
}
@media (min-width: 1024px) {
  .demo-sidebar { display: block; }
}
.demo-brand { display: flex; gap: 12px; align-items: center; margin-bottom: 28px; }
.demo-brand-mark {
  width: 44px; height: 44px;
  background: var(--gov-blue);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  color: white; font-family: var(--font-display); font-weight: 600; font-size: 12px;
  letter-spacing: 0.4px;
}
.demo-brand-text h1 { font-family: var(--font-display); font-size: 16px; font-weight: 600; line-height: 1.1; }
.demo-brand-text p { font-size: 11px; color: var(--gray-500); margin-top: 2px; }

.demo-strip { display: flex; height: 4px; border-radius: 999px; overflow: hidden; margin-bottom: 24px; }
.demo-strip > div { flex: 1; }

.demo-section-title {
  font-size: 10px; font-weight: 600; color: var(--gray-500);
  letter-spacing: 1.2px; text-transform: uppercase; margin: 24px 0 10px;
}
.demo-role-switcher { display: flex; gap: 6px; background: var(--gray-100); padding: 4px; border-radius: 10px; margin-bottom: 20px; }
.demo-role-btn {
  flex: 1; padding: 8px 6px; border-radius: 7px; font-size: 11px; font-weight: 500;
  color: var(--gray-700); transition: all 0.15s; text-align: center;
}
.demo-role-btn.active { background: white; color: var(--gov-blue-dark); box-shadow: var(--shadow-sm); font-weight: 600; }

.demo-nav { display: flex; flex-direction: column; gap: 2px; }
.demo-nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 8px; font-size: 13px;
  color: var(--gray-700); text-align: left; width: 100%;
  transition: all 0.15s;
}
.demo-nav-item:hover { background: var(--gray-100); }
.demo-nav-item.active { background: var(--gov-blue-light); color: var(--gov-blue-dark); font-weight: 600; }
.demo-nav-item .nav-num { font-size: 10px; opacity: 0.5; min-width: 18px; }
.demo-nav-item.active .nav-num { opacity: 0.8; }

.demo-footer { margin-top: 32px; padding-top: 20px; border-top: 0.5px solid var(--border); font-size: 11px; color: var(--gray-500); line-height: 1.6; }
.demo-footer strong { color: var(--gray-700); font-weight: 600; }

/* ========== TOP BAR (mobile) ========== */
.demo-topbar {
  background: white;
  border-bottom: 0.5px solid var(--border);
  padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
}
@media (min-width: 1024px) { .demo-topbar { display: none; } }
.demo-topbar-mark { display: flex; align-items: center; gap: 10px; }
.demo-topbar-mark .demo-brand-mark { width: 32px; height: 32px; font-size: 10px; }
.demo-topbar-title { font-family: var(--font-display); font-weight: 600; font-size: 14px; }
.demo-menu-btn {
  background: var(--gray-100); border-radius: 8px; padding: 8px 12px;
  font-size: 12px; font-weight: 500; color: var(--gray-700);
}

/* drawer mobile */
.mobile-drawer {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100;
  display: none; align-items: stretch;
}
.mobile-drawer.open { display: flex; }
.mobile-drawer-panel {
  background: white; width: 86%; max-width: 320px; height: 100%;
  overflow-y: auto; padding: 24px 20px;
  animation: slideIn 0.2s ease-out;
}
@keyframes slideIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }

/* ========== STAGE (área de demonstração) ========== */
.stage {
  padding: 32px 24px 48px;
  display: flex; flex-direction: column; align-items: center;
  min-height: 100vh;
}
.stage-header {
  width: 100%; max-width: 1100px;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
}
.stage-title-block h2 {
  font-family: var(--font-display); font-size: 22px; font-weight: 600;
  color: var(--gray-900); line-height: 1.2;
}
.stage-title-block p { font-size: 13px; color: var(--gray-700); margin-top: 4px; max-width: 600px; }
.stage-controls { display: flex; gap: 8px; align-items: center; }
.stage-toggle { display: inline-flex; gap: 2px; background: white; padding: 4px; border-radius: 10px; border: 0.5px solid var(--border); }
.stage-toggle button {
  padding: 6px 14px; border-radius: 7px; font-size: 12px; font-weight: 500;
  color: var(--gray-700);
}
.stage-toggle button.active { background: var(--gov-blue); color: white; }

/* ========== PHONE FRAME ========== */
.device-stage { display: flex; justify-content: center; align-items: flex-start; padding: 8px 0; }
.phone-frame {
  width: 380px; max-width: 100%;
  background: #1A1A1A;
  border-radius: 38px;
  padding: 12px;
  box-shadow: var(--shadow-lg), 0 0 0 1px rgba(0,0,0,0.08);
  position: relative;
}
.phone-frame::before {
  content: ''; position: absolute;
  top: 18px; left: 50%; transform: translateX(-50%);
  width: 100px; height: 22px;
  background: #1A1A1A; border-radius: 999px;
  z-index: 10;
}
.phone-screen {
  background: white;
  border-radius: 28px;
  overflow: hidden;
  height: 760px;
  display: flex; flex-direction: column;
  position: relative;
}
.phone-statusbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 28px 8px;
  font-size: 12px; font-weight: 600;
}
.phone-statusbar .status-icons { display: flex; gap: 4px; align-items: center; }
.phone-statusbar svg { width: 14px; height: 14px; }

.phone-content {
  flex: 1; overflow-y: auto;
  scrollbar-width: thin;
}
.phone-content::-webkit-scrollbar { width: 4px; }
.phone-content::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 999px; }

/* GOV bar header dentro do app */
.app-gov-bar {
  background: var(--gov-blue);
  color: white;
  padding: 10px 16px;
  font-size: 11px;
  font-family: var(--font-display);
  font-weight: 500;
  display: flex; align-items: center; gap: 8px;
  letter-spacing: 0.3px;
}
.app-gov-bar .gov-brand { background: white; color: var(--gov-blue); padding: 2px 6px; border-radius: 3px; font-weight: 700; font-size: 10px; }

.app-header {
  padding: 16px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 0.5px solid var(--border);
  background: white;
  position: sticky; top: 0; z-index: 5;
}
.app-back {
  width: 34px; height: 34px;
  border-radius: 999px; background: var(--gray-100);
  display: flex; align-items: center; justify-content: center;
  color: var(--gray-700);
  transition: all 0.15s;
}
.app-back:hover { background: var(--gray-200); }
.app-header-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; flex: 1; text-align: center; }
.app-header-actions { display: flex; gap: 8px; }
.app-header-icon-btn {
  width: 34px; height: 34px;
  border-radius: 999px; background: var(--gray-100);
  display: flex; align-items: center; justify-content: center;
  position: relative;
  color: var(--gray-700);
}
.app-notif-dot {
  position: absolute; top: 6px; right: 6px;
  width: 8px; height: 8px; border-radius: 999px; background: var(--coral-600);
  border: 1.5px solid white;
}

.app-body { padding: 18px 16px 90px; }

/* tab bar inferior */
.tab-bar {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: white;
  border-top: 0.5px solid var(--border);
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 8px 6px 14px;
}
.tab-item {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 4px; border-radius: 8px;
  color: var(--gray-500); transition: all 0.15s;
}
.tab-item.active { color: var(--gov-blue); }
.tab-item svg { width: 22px; height: 22px; }
.tab-item span { font-size: 10px; font-weight: 500; }
.tab-item:hover { color: var(--gov-blue-dark); }

/* ========== ELEMENTOS COMPARTILHADOS ========== */
.kid-hero {
  background: linear-gradient(135deg, var(--gov-blue) 0%, #1B5FC4 100%);
  color: white; border-radius: 14px; padding: 16px;
  display: flex; align-items: center; gap: 12px;
  box-shadow: 0 4px 12px rgba(19, 81, 180, 0.15);
}
.kid-avatar {
  width: 52px; height: 52px; border-radius: 999px;
  background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 600; font-size: 18px;
  flex-shrink: 0;
}
.kid-info h3 { font-family: var(--font-display); font-size: 16px; font-weight: 600; margin: 0; }
.kid-info p { font-size: 12px; opacity: 0.85; margin-top: 2px; }
.kid-tag {
  display: inline-block;
  background: rgba(255,255,255,0.18);
  padding: 3px 8px; border-radius: 999px;
  font-size: 10px; font-weight: 500; margin-top: 4px;
  letter-spacing: 0.3px;
}

.section-title {
  font-family: var(--font-display);
  font-size: 13px; font-weight: 600;
  color: var(--gray-900);
  margin: 20px 0 10px;
  display: flex; align-items: center; justify-content: space-between;
}
.section-title .see-all { font-size: 11px; color: var(--gov-blue); font-weight: 500; }

.metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
.metric-card {
  background: white; border: 0.5px solid var(--border);
  border-radius: 12px; padding: 12px;
  transition: all 0.15s;
}
.metric-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
.metric-label { font-size: 11px; color: var(--gray-500); margin-bottom: 4px; font-weight: 500; }
.metric-value { font-family: var(--font-display); font-size: 22px; font-weight: 600; line-height: 1.1; }
.metric-trend { font-size: 10px; margin-top: 4px; font-weight: 500; }
.metric-trend.up { color: var(--teal-600); }
.metric-trend.down { color: var(--coral-600); }

.alert-card {
  background: var(--amber-50);
  border-radius: 10px;
  padding: 12px;
  display: flex; gap: 10px; align-items: flex-start;
  border-left: 3px solid var(--amber-600);
  cursor: pointer; transition: all 0.15s;
}
.alert-card:hover { transform: translateX(2px); }
.alert-icon { width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--amber-700); }
.alert-content h4 { font-size: 13px; font-weight: 600; color: var(--amber-700); margin-bottom: 2px; }
.alert-content p { font-size: 11px; color: var(--amber-700); opacity: 0.85; }

.shortcut-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 0; }
.shortcut-item {
  background: white; border: 0.5px solid var(--border); border-radius: 12px;
  padding: 12px 6px; text-align: center;
  transition: all 0.15s; cursor: pointer; width: 100%;
}
.shortcut-item:hover { transform: translateY(-2px); border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
.shortcut-icon {
  width: 36px; height: 36px; border-radius: 10px;
  margin: 0 auto 6px;
  display: flex; align-items: center; justify-content: center;
}
.shortcut-label { font-size: 10px; font-weight: 500; color: var(--gray-900); }

.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: 999px;
  font-size: 11px; font-weight: 500; margin: 2px 4px 2px 0;
}
.chip-info { background: var(--gov-blue-light); color: var(--gov-blue-dark); }
.chip-success { background: var(--teal-50); color: var(--teal-700); }
.chip-warn { background: var(--amber-50); color: var(--amber-700); }
.chip-danger { background: var(--red-50); color: var(--red-700); }
.chip-purple { background: var(--purple-50); color: var(--purple-700); }
.chip-dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; }

.timeline { display: flex; flex-direction: column; gap: 0; }
.timeline-item {
  display: flex; gap: 12px; padding: 10px 0;
  border-bottom: 0.5px solid var(--border);
  cursor: pointer; transition: all 0.15s;
}
.timeline-item:hover { background: var(--gray-50); }
.timeline-item:last-child { border-bottom: none; }
.timeline-marker { display: flex; flex-direction: column; align-items: center; padding-top: 4px; }
.timeline-dot {
  width: 12px; height: 12px; border-radius: 999px;
  border: 2px solid white;
  box-shadow: 0 0 0 1.5px currentColor;
}
.timeline-content { flex: 1; min-width: 0; }
.timeline-meta { font-size: 10px; color: var(--gray-500); margin-bottom: 2px; }
.timeline-title { font-size: 13px; font-weight: 600; color: var(--gray-900); }
.timeline-desc { font-size: 12px; color: var(--gray-700); margin-top: 4px; line-height: 1.5; }

.btn-primary {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--gov-blue); color: white;
  padding: 14px 16px; border-radius: 10px;
  font-size: 14px; font-weight: 600;
  width: 100%;
  transition: all 0.15s;
  font-family: var(--font-display);
}
.btn-primary:hover { background: var(--gov-blue-dark); transform: translateY(-1px); box-shadow: var(--shadow-md); }
.btn-secondary {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: white; color: var(--gray-900); border: 0.5px solid var(--border-strong);
  padding: 12px 16px; border-radius: 10px;
  font-size: 13px; font-weight: 500;
  width: 100%;
  transition: all 0.15s;
}
.btn-secondary:hover { background: var(--gray-50); }

.btn-emergency {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--red-600); color: white;
  padding: 16px;
  border-radius: 12px;
  font-family: var(--font-display);
  font-size: 15px; font-weight: 600;
  width: 100%;
  transition: all 0.15s;
  box-shadow: 0 4px 12px rgba(163, 45, 45, 0.25);
}
.btn-emergency:hover { background: var(--red-700); transform: translateY(-1px); }

.field-list { display: flex; flex-direction: column; gap: 10px; }
.field-row {
  background: white; border: 0.5px solid var(--border); border-radius: 10px;
  padding: 10px 12px;
}
.field-label { font-size: 10px; color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600; margin-bottom: 4px; }
.field-value { font-size: 13px; font-weight: 500; color: var(--gray-900); }

.team-list { display: flex; flex-direction: column; gap: 6px; }
.team-card {
  background: white; border: 0.5px solid var(--border); border-radius: 10px;
  padding: 10px; display: flex; align-items: center; gap: 10px;
  transition: all 0.15s; cursor: pointer;
}
.team-card:hover { border-color: var(--border-strong); transform: translateX(2px); }
.team-avatar {
  width: 36px; height: 36px; border-radius: 999px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 12px; flex-shrink: 0;
  font-family: var(--font-display);
}
.team-info { flex: 1; min-width: 0; }
.team-name { font-size: 13px; font-weight: 600; color: var(--gray-900); }
.team-spec { font-size: 11px; color: var(--gray-500); margin-top: 1px; }

.progress-row { margin: 12px 0; }
.progress-head { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; }
.progress-head .progress-label { color: var(--gray-700); font-weight: 500; }
.progress-head .progress-value { font-weight: 600; color: var(--gray-900); }
.progress-bar { height: 6px; background: var(--gray-100); border-radius: 999px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 999px; transition: width 0.6s ease; }

/* ========== TELA: LOGIN ========== */
.login-screen {
  display: flex; flex-direction: column; height: 100%;
  background: linear-gradient(180deg, var(--gov-blue-light) 0%, white 50%);
  padding: 32px 24px;
}
.login-strip { display: flex; height: 4px; border-radius: 999px; overflow: hidden; margin: -32px -24px 32px; }
.login-strip > div { flex: 1; }
.login-logo {
  width: 72px; height: 72px;
  background: var(--gov-blue);
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  color: white; font-family: var(--font-display); font-weight: 700; font-size: 16px;
  margin: 0 auto 20px;
  box-shadow: 0 8px 24px rgba(19, 81, 180, 0.25);
  letter-spacing: 0.5px;
}
.login-title {
  font-family: var(--font-display); font-size: 22px; font-weight: 600;
  text-align: center; margin-bottom: 4px;
}
.login-sub { text-align: center; color: var(--gray-700); font-size: 13px; margin-bottom: 28px; }
.role-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 8px; margin-bottom: 24px;
}
.role-card {
  background: white; border: 1.5px solid var(--border); border-radius: 12px;
  padding: 14px 8px; text-align: center;
  transition: all 0.15s; cursor: pointer;
}
.role-card:hover { border-color: var(--gov-blue-mid); }
.role-card.active { border-color: var(--gov-blue); background: var(--gov-blue-light); }
.role-card.active .role-label { color: var(--gov-blue-dark); font-weight: 600; }
.role-card .role-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--gray-100); display: flex; align-items: center; justify-content: center;
  margin: 0 auto 8px;
  color: var(--gray-700);
}
.role-card.active .role-icon { background: var(--gov-blue); color: white; }
.role-label { font-size: 12px; font-weight: 500; }

.input-field {
  display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px;
}
.input-field label { font-size: 11px; font-weight: 600; color: var(--gray-700); letter-spacing: 0.3px; }
.input-field input {
  background: white; border: 1px solid var(--border-strong); border-radius: 10px;
  padding: 12px 14px; font-size: 14px;
  transition: all 0.15s;
}
.input-field input:focus { outline: none; border-color: var(--gov-blue); box-shadow: 0 0 0 3px var(--gov-blue-light); }

.login-help { text-align: center; margin-top: 16px; font-size: 12px; color: var(--gray-500); }
.login-help a { color: var(--gov-blue); font-weight: 500; cursor: pointer; }

/* ========== DASHBOARD ========== */
.dashboard-greet {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 16px;
}
.dashboard-greet h2 { font-family: var(--font-display); font-size: 20px; font-weight: 600; line-height: 1.2; }

              <div className="stage-title-block">
                <h2>{navItems.find(it => it.id === screen)?.label || 'Caderneta TEA'}</h2>
                <p>{screen === 'login' ? 'Use os botões e o menu lateral para navegar pelo protótipo.' : 'Toque nos elementos para explorar a navegação real entre as telas.'}</p>
              </div>
              <div className="stage-toggle">
                <button className={view === 'mobile' ? 'active' : ''} onClick={() => setView('mobile')}>Mobile</button>
                <button className={view === 'tablet' ? 'active' : ''} onClick={() => setView('tablet')}>Tablet</button>
              </div>
            </div>
            <div className="device-stage">
              <div className="phone-frame">
                <div className="phone-screen">
                  <PhoneStatusBar/>
                  <div className="phone-content">
                    {renderScreen()}
                  </div>
                </div>
              </div>
            </div>
            <div className="demo-hint">
              <div className="hint-icon"><Icon name="info" size={14}/></div>
              <div>
                <strong>Demonstração interativa.</strong> Toque nos atalhos do dashboard, nos itens das listas e nos botões "voltar" para navegar. Todos os dados são fictícios.
              </div>
            </div>
          </>
        ) : (
          <>
            <div className="stage-header">
              <div className="stage-title-block">
                <h2>Painel profissional · SESAPI</h2>
                <p>Visão tablet/web para profissionais da equipe multiprofissional, com indicadores consolidados.</p>
              </div>
              <div className="stage-toggle">
                <button className={view === 'mobile' ? 'active' : ''} onClick={() => setView('mobile')}>Mobile</button>
                <button className={view === 'tablet' ? 'active' : ''} onClick={() => setView('tablet')}>Tablet</button>
              </div>
            </div>
            <TabletView/>
          </>
        )}
      </div>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
